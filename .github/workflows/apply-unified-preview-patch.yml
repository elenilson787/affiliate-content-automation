name: Apply unified preview patch
on:
  push:
    paths:
      - scripts/patch_unified_preview_v3.py
      - .github/workflows/apply-unified-preview-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/patch_unified_preview_v3.py
      - run: npm ci
      - run: npm run check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin.ts src/automation.ts
          git diff --cached --quiet || git commit -m "Unifica prévia e motor real de seleção"
          git push
