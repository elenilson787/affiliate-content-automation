name: Apply end state fix

on:
  push:
    paths:
      - 'scripts/fix_end_state_and_dashboard.py'
      - '.github/workflows/apply-end-state-fix.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/fix_end_state_and_dashboard.py
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rule-policy.ts src/admin.ts
          git commit -m "Marca campanhas encerradas ao fim da janela" || exit 0
          git push
