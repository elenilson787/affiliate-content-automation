name: One-time interval preview topics upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.head_commit.message == 'Executa intervalo, prévia e tópicos no painel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply interval preview topics upgrade
        run: python scripts/upgrade_interval_preview_topics.py
      - name: Validate
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin.ts src/automation.ts
          git commit -m "Adiciona intervalos, prévia inline e tópicos Telegram"
          git push
