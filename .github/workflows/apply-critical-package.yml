name: Apply critical UX package

on:
  push:
    paths:
      - 'scripts/patch_critical_package.py'
      - '.github/workflows/apply-critical-package.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply critical package
        run: python scripts/patch_critical_package.py
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate
        run: npm run check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin.ts src/rule-policy.ts
          git commit -m "Corrige agenda, dashboard e formulário da automação" || exit 0
          git push
