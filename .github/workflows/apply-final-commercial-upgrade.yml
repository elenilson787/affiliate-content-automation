name: Apply final commercial upgrade

on:
  push:
    paths:
      - 'scripts/patch_final_automation.py'
      - 'scripts/patch_final_admin.py'
      - '.github/workflows/apply-final-commercial-upgrade.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply backend patch
        run: python scripts/patch_final_automation.py
      - name: Apply admin patch
        run: python scripts/patch_final_admin.py
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate
        run: npm run check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/automation.ts src/admin.ts
          git commit -m "Implementa agenda inteligente, atividade e integrações" || exit 0
          git push
