name: Fix preview topic scope
on:
  push:
    paths:
      - scripts/fix_preview_topic_scope.py
      - .github/workflows/fix-preview-topic-scope.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/fix_preview_topic_scope.py
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin.ts
          git diff --cached --quiet || git commit -m "Corrige escopo do tópico na prévia"
          git push
