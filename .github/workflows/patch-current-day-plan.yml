name: Patch current day plan
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_current_day_plan.py'
      - '.github/workflows/patch-current-day-plan.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/patch_current_day_plan.py
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Commit patch
        run: |
          if git diff --quiet -- src/admin.ts; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin.ts
          git commit -m "Ajusta agenda do primeiro dia ao horário atual"
          git push
