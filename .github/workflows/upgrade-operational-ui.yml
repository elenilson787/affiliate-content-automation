name: One-time operational UI upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.head_commit.message == 'Executa upgrade operacional do painel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply upgrade
        run: python scripts/upgrade_operational_ui.py
      - name: Validate
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/types.ts lib/content-engine.ts lib/publishers/telegram.ts src/automation.ts src/admin.ts
          git commit -m "Evolui painel para operação completa"
          git push
