name: One-time description search adjustment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-description-search.yml

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply description search adjustment
        run: python scripts/remove_keyword_add_description.py
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate
        run: npm run check
      - name: Commit adjustment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin.ts src/automation.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remove palavra-chave e usa descrição na automação"
            git push
          fi
