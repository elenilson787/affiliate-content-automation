name: One-time safe interval fallback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.head_commit.message == 'Executa fallback seguro do agendamento'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply safe fallback
        run: python scripts/safe_interval_fallback.py
      - name: Validate
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin.ts
          git commit -m "Mantém fallback horário seguro no agendamento"
          git push
