name: One-time smart search upgrade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-smart-search-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply smart search upgrade
        run: python scripts/upgrade_search_like_afiliapulse.py
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate
        run: npm run check
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/offer-engine.ts lib/affiliate/shopee/adapter.ts src/automation.ts src/admin.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Implementa busca inteligente estilo AFILIAPULSE"
            git push
          fi
